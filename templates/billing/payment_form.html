{% extends "base.html" %}

{% block content %}
  <form method="post" class="space-y-6" data-payment-form novalidate>
    {% csrf_token %}
    {{ enrollment_payloads|json_script:"enrollment-payloads" }}
    {% include "billing/includes/payment_form_fields.html" %}
    <div class="flex flex-wrap gap-3">
      <button type="submit" class="btn-primary">ទទួលបង់ប្រាក់ និងចេញបង្កាន់ដៃ</button>
      <a href="{% url 'billing:payment_list' %}" class="btn-secondary">បោះបង់</a>
    </div>
  </form>
{% endblock %}

{% block extra_js %}
  {% include "billing/includes/payment_form_script.html" %}
{% endblock %}
