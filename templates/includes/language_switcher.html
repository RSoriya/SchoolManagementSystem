<form method="post" action="{% url 'set_language' %}" class="flex overflow-hidden rounded-xl border border-slate-200 text-xs font-bold" data-no-i18n>
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next|default:request.get_full_path }}">
  <button type="submit" name="language" value="km" class="px-2.5 py-1.5 {% if LANGUAGE_CODE == 'km' %}bg-brand-50 text-brand-700{% else %}text-slate-500 hover:bg-slate-50{% endif %}">ខ្មែរ</button>
  <button type="submit" name="language" value="en" class="px-2.5 py-1.5 {% if LANGUAGE_CODE == 'en' %}bg-brand-50 text-brand-700{% else %}text-slate-500 hover:bg-slate-50{% endif %}">EN</button>
</form>
