{% if page.paginator.count %}
  <nav class="flex shrink-0 flex-wrap items-center justify-between gap-3 border-t border-slate-100 px-4 py-3 text-sm text-slate-500" aria-label="ទំព័រ">
    <span>បង្ហាញ {{ page.start_index }}–{{ page.end_index }} ក្នុង {{ page.paginator.count }} · ទំព័រ {{ page.number }} / {{ page.paginator.num_pages }}</span>
    <div class="flex gap-2">
      {% if page.has_previous %}
        <a class="btn-quiet" href="?page={{ page.previous_page_number }}{{ extra_query }}">មុន</a>
      {% endif %}
      {% if page.has_next %}
        <a class="btn-quiet" href="?page={{ page.next_page_number }}{{ extra_query }}">បន្ទាប់</a>
      {% endif %}
    </div>
  </nav>
{% endif %}
