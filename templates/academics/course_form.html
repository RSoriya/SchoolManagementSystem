{% extends "base.html" %}

{% block content %}
  <form method="post" class="mx-auto max-w-3xl space-y-6" novalidate>
    {% csrf_token %}
    <section class="panel p-6">
      <h2 class="mb-5 text-lg font-bold text-slate-900">ព័ត៌មានវគ្គ</h2>
      <div class="grid gap-5 sm:grid-cols-2">
        {% include "academics/includes/course_form_fields.html" %}
      </div>
    </section>
    <div class="flex gap-3">
      <button type="submit" class="btn-primary">រក្សាទុក</button>
      <a href="{% if course %}{{ course.get_absolute_url }}{% else %}{% url 'academics:course_list' %}{% endif %}" class="btn-secondary">បោះបង់</a>
    </div>
  </form>
{% endblock %}
